services:
  - type: web
    name: easeinn
    runtime: docker
    dockerfilePath: ./ocr-server/Dockerfile
    dockerContext: ./ocr-server
    healthCheckPath: /
    disk:
      name: easeinn-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: WHATSAPP_DATA_DIR
        value: /data
      - key: WHATSAPP_AUTH_DIR
        value: /data/baileys_auth
